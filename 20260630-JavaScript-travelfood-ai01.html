<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 地方美食資料練習</title>
    <link rel="stylesheet" href="css/myall.css">
</head>

<style>
    /* ========================================
   三麗鷗風格｜地方美食列表
   不修改 HTML / JS
   ======================================== */


/* ---------- 全站變數 ---------- */

:root {
    /* 三麗鷗主色 */
    --sanrio-pink: #ff9fc9;
    --sanrio-pink-light: #ffe6f0;
    --sanrio-pink-dark: #e85d91;

    --cream: #fffaf5;
    --white: #ffffff;

    /* 輔助色 */
    --purple: #c9b6ff;
    --blue: #bde9ff;
    --yellow: #ffe89a;

    /* 文字 */
    --text: #6b5360;
    --text-light: #9a7d8b;

    /* 圓角 */
    --radius-small: 12px;
    --radius: 20px;
    --radius-large: 28px;

    /* 陰影 */
    --shadow:
        0 5px 15px rgba(220, 105, 155, 0.18);

    --shadow-hover:
        0 10px 25px rgba(220, 105, 155, 0.30);

    /* 動畫 */
    --transition: 0.3s ease;
}


/* ========================================
   基本設定
   ======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;

    background:
        radial-gradient(
            circle at 10% 15%,
            var(--sanrio-pink-light) 0 45px,
            transparent 46px
        ),
        radial-gradient(
            circle at 90% 10%,
            var(--purple) 0 35px,
            transparent 36px
        ),
        radial-gradient(
            circle at 85% 85%,
            var(--blue) 0 50px,
            transparent 51px
        ),
        var(--cream);

    color: var(--text);

    font-family:
        "Microsoft JhengHei",
        "Arial Rounded MT Bold",
        sans-serif;

    line-height: 1.8;
}


/* ========================================
   頁面大標題
   ======================================== */

.mytitle-01 {
    position: relative;

    width: 90%;
    margin: 35px auto 25px;

    padding: 18px 20px;

    text-align: center;

    color: var(--sanrio-pink-dark);

    font-size: 38px;
    font-weight: 900;

    letter-spacing: 4px;

    background: var(--white);

    border: 4px solid var(--sanrio-pink);

    border-radius: var(--radius-large);

    box-shadow: var(--shadow);
}


/* 標題蝴蝶結 */

.mytitle-01::before {
    content: "🎀";

    position: absolute;

    left: 25px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 32px;
}

.mytitle-01::after {
    content: "🎀";

    position: absolute;

    right: 25px;
    top: 50%;

    transform: translateY(-50%);

    font-size: 32px;
}


/* ========================================
   美食外框
   ======================================== */

.wapper {
    width: 1024px;

    margin: 20px auto 40px;

    padding: 22px;

    overflow: hidden;

    background:
        linear-gradient(
            135deg,
            rgba(255, 255, 255, 0.95),
            rgba(255, 230, 240, 0.75)
        );

    border: 4px solid var(--sanrio-pink);

    border-radius: var(--radius-large);

    box-shadow: var(--shadow);
}


/* ========================================
   店家卡片
   ======================================== */

.demo {
    position: relative;

    width: 32%;

    margin-top: 5px;
    margin-right: 1%;
    margin-bottom: 20px;

    float: left;

    overflow: hidden;

    background: var(--white);

    border: 3px solid var(--sanrio-pink-light);

    border-radius: var(--radius);

    box-shadow: var(--shadow);

    transition:
        transform var(--transition),
        box-shadow var(--transition),
        border-color var(--transition);
}


/* 第三張卡片後不需要右邊距 */

.demo:nth-child(3n) {
    margin-right: 0;
}


/* 滑鼠移過去 */

.demo:hover {
    transform: translateY(-8px) rotate(1deg);

    border-color: var(--sanrio-pink);

    box-shadow: var(--shadow-hover);
}


/* ========================================
   店家圖片
   ======================================== */

.demo .logo {
    width: 100%;
    height: 220px;

    background-position: center;
    background-size: cover;
    background-repeat: no-repeat;

    border-bottom: 4px solid var(--sanrio-pink-light);

    transition:
        transform var(--transition);
}


/* 圖片滑鼠效果 */

.demo:hover .logo {
    transform: scale(1.03);
}


/* ========================================
   店家資訊
   ======================================== */

.mytitle-05 {
    position: relative;

    margin: 0;

    padding: 12px 15px 12px 45px;

    color: var(--text);

    font-size: 16px;
    font-weight: 700;

    background: var(--white);

    border-bottom: 2px dashed var(--sanrio-pink-light);
}


/* 最後一列不要底線 */

.mytitle-05:last-child {
    border-bottom: none;
}


/* 資訊前面的愛心 */

.mytitle-05::before {
    content: "♡";

    position: absolute;

    left: 17px;

    color: var(--sanrio-pink);

    font-size: 22px;
    font-weight: 900;
}


/* ========================================
   第一行店家名稱
   ======================================== */

.demo .mytitle-05:first-of-type {
    padding-top: 16px;

    color: var(--sanrio-pink-dark);

    font-size: 18px;

    background:
        linear-gradient(
            90deg,
            var(--pink-light, #ffe6f0),
            var(--white)
        );
}


/* ========================================
   可愛裝飾
   ======================================== */

/* 左上角小蝴蝶結 */

.demo::before {
    content: "🎀";

    position: absolute;

    z-index: 5;

    top: 8px;
    left: 8px;

    font-size: 24px;

    filter: drop-shadow(
        1px 2px 2px rgba(0, 0, 0, 0.15)
    );
}


/* 右下角小愛心 */

.demo::after {
    content: "♡";

    position: absolute;

    right: 12px;
    bottom: 8px;

    color: var(--sanrio-pink);

    font-size: 28px;

    opacity: 0.5;
}


/* ========================================
   選取文字
   ======================================== */

::selection {
    background: var(--sanrio-pink);
    color: var(--white);
}


/* ========================================
   RWD｜平板
   ======================================== */

@media screen and (max-width: 1024px) {

    .wapper {
        width: 94%;

        padding: 15px;
    }

    .demo {
        width: 100%;

        margin-right: 0;
        margin-bottom: 20px;
    }

    .demo:nth-child(3n) {
        margin-right: 0;
    }

}


/* ========================================
   RWD｜手機
   ======================================== */

@media screen and (max-width: 600px) {

    .mytitle-01 {
        width: 94%;

        padding: 15px 50px;

        font-size: 28px;

        letter-spacing: 2px;
    }

    .mytitle-01::before {
        left: 10px;
        font-size: 24px;
    }

    .mytitle-01::after {
        right: 10px;
        font-size: 24px;
    }

    .wapper {
        width: 94%;

        padding: 10px;
    }

    .demo .logo {
        height: 200px;
    }

}
</style>

<body>

    地址:xxx

    <div class="display-1 fw-900 mytitle-01">地方美食列表</div>

        <div class="demo">
            <div class="logo bg-img" style="background-image: url(image/1.avif);"></div>
            <p class="mytitle-05">店家名稱:</p>
            <p class="mytitle-05">電話:</p>
            <p class="mytitle-05">地址:</p>
        </div>
    </div>

    <script src="js/TravelFood.js"></script>

</body>

</html>
