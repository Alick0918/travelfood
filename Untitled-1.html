<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenData - 地方美食資料練習</title>
    <link rel="stylesheet" href="css/myall.css">
</head>

<style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

.wapper {
    width: 1024px;
    margin: 20px auto 0;
    padding: 15px;

    display: flex;
    flex-wrap: wrap;
    gap: 10px;

    box-shadow: 2px 2px 2px 2px rgb(106, 127, 221);
}

.demo {
    width: calc((100% - 20px) / 3);
    box-shadow: 2px 2px 1px 1px rgb(97, 98, 96);
}

.demo .logo {
    width: 100%;
    height: 220px;
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
}

@media screen and (max-width: 1024px) {
    .wapper {
        width: 94%;
    }

    .demo {
        width: 100%;
    }
}


</style>

<body>
    
    <!-- 顯示每一家店名稱、電話、地址
    店家名稱:xxx
    電話:xxx
    地址:xxx 
    -->

    <div class="display-1 fw-900 mytitle-01">地方美食列表</div>    
    <div class="wapper" id="foodlist">
        <div class="demo">
            <div class="logo bg-img" style="background-image: url(image/1.avif);"></div>
            <p class="mytitle-05">店家名稱:</p>
            <p class="mytitle-05">電話:</p>
            <p class="mytitle-05">地址:</p>
        </div>
    </div>
    <script src="js/jquery-4.0.0.js"></script>
    <script src="js/TravelFood.js"></script>
    <script>

        food.forEach(function (item) {
            // console.log(item.Name);
            // console.log(item.Tel)
            // console.log(item.Address)
            $("#foodlist").append('<div class="demo" id="foodlist"><div class="logo bg-img" style="background-image: url(' + item.PicURL + ');"></div><p class="mytitle-05">店家名稱:'+item.Name+'</p><p class="mytitle-05">電話:'+item.Tel+'</p><p class="mytitle-05">地址:'+item.Address+'</p></div>')
        });

    </script>


</body>

</html>
