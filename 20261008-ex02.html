<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>切版練習02</title>
    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/myall.css">
    <style>
        .box01 {
            height: 200px;
            background-image: url(image/1.avif);
        }

        .box02 {
            height: 180px;
            line-height: 180px;
            margin-top: 5px;
            background-color: #725d5d;
            color: rgb(197, 215, 201);
        }

        .box03 {
            border: 2px solid cornsilk;
            padding: 10px;
            border-radius: 10px;
            box-shadow: 2px 2px 2px 2px rgb(151, 147, 133);
        }

        .box03 .h4 {
            margin-top: 15px;
            margin-bottom: 15px;
        }

        @media screen and (max-width: 768px) {
            .box02 {
                height: 100px;
                line-height: 100px;
            }
        }

        @media screen and (min-width: 992px) {
            .box02 {
                width: 220px;
                height: 220px;
                line-height: 220px;
                border-radius: 50%;
                background-color: #fff;
                margin-top: 15px;
                margin-bottom: 15px;
            }
        }

        @media screen and (min-width: 1200px) {
            .box02 {
                width: 260px;
                height: 260px;
                line-height: 260px;
                background-color: cornflowerblue;
                margin-top: 25px;
                margin-bottom: 25px;
            }
        }
    </style>
</head>
<body>
    <div class="container py-3">
        <div class="row">
            <div class="col-12 mt-3 d-none d-sm-block">
                <div class="box01 bg-img"></div>
            </div>
        </div>
        <div class="row">
            <div class="col-sm-6 mt-3 col-md-3">
                <div class="box02 bg-success h2 text-center fw-700">選單01</div>
            </div>
            <div class="col-sm-6 mt-3 col-md-3">
                <div class="box02 bg-success h2 text-center fw-700">選單02</div>
            </div>
            <div class="col-sm-6 mt-3 col-md-3">
                <div class="box02 bg-success h2 text-center fw-700">選單03</div>
            </div>
            <div class="col-sm-6 mt-3 col-md-3">
                <div class="box02 bg-success h2 text-center fw-700">選單04</div>
            </div>
        </div>

        <div class="row" id="travelfood-list">
            <div class="col-md-6 col-lg-4">
                <div class="box03">
                    <img src="image/2.jpg" class="img-fluid" alt="">
                    <div class="h4 fw-700 text-center mt-3">旅遊景點介紹001</div>
                    <div class="h3">地址: XXX</div>
                    <div class="h3">電話: XXX</div>
                    <div class="h3">簡介: XXX</div>
                </div>
            </div>
        </div>
        <div class="row">
            <div class="col-12 mt-3 d-none d-md-block fw-700 text-center bg-secondary py-2 h4">
                POWER BY XXX 2026.10
            </div>
        </div>
    </div>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/jquery-4.0.0.js"></script>
    <script>
        $(function(){
            // 介接資料
            $.ajax({
                type: "GET",
                url: "http://localhost:3000/travelfood",
                dataType: "json",
                success: showdata,
                error: function(){
                    console.log("介接失敗");
                    alert("介接失敗");
                }
            });
        });

        function showdata(data){
            console.log(data);
            $("#travelfood-list").empty();
            data[0].travelfood.forEach(function(item){
                const strHTML = `<div class="col-md-6 col-lg-4">
                                    <div class="box03">
                                        <img src="image/2.jpg" class="img-fluid" alt="">
                                        <div class="h4 fw-700 text-center mt-3">${item.Name}</div>
                                        <div class="h3">地址: ${item.City}${item.Town}${item.Address}</div>
                                        <div class="h3">電話: ${item.Tel}</div>
                                        <div class="h3">簡介: ${item.HostWords}</div>
                                    </div>
                                </div>`;
                $("#travelfood-list").append(strHTML);
            });
        }
    </script>
</body>

</html>
